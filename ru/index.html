/* ---------- РИСУНКИ ---------- */
const PROP = {
  9:  {sh:1.4, b:2.1, w:3.0, hp:3.8, cr:4.35, k:6.4, an:8.55},
  7.5:{sh:1.3, b:2.0, w:2.8, hp:3.5, cr:3.9,  k:5.6, an:7.1},
  6:  {sh:1.25,b:1.9, w:2.55,hp:3.05,cr:3.35, k:4.6, an:5.65}
};
function croquis(N,h,cx,y0,solid){
  const P=PROP[N], X=u=>(cx+u*h).toFixed(1), Y=u=>(y0+u*h).toFixed(1);
  const sw=Math.max(.7,h*.045).toFixed(2);
  const fill=solid?INK:"#fff", st=solid?"none":INK;
  let s="";
  // руки
  [-1,1].forEach(d=>{
    const pts=`${X(d*.8)},${Y(P.sh+.08)} ${X(d*.88)},${Y(P.w)} ${X(d*.82)},${Y(P.cr+.25)}`;
    if(solid) s+=`<polyline points="${pts}" fill="none" stroke="${INK}" stroke-width="${(h*.16).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    else s+=`<polyline points="${pts}" fill="none" stroke="${INK}" stroke-width="${(h*.2).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="${(h*.2-2*sw).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  // ноги
  [-1,1].forEach(d=>{
    s+=`<path d="M${X(d*.66)},${Y(P.hp)} L${X(d*.42)},${Y(P.k)} L${X(d*.25)},${Y(P.an)} L${X(d*.31)},${Y(N-.05)} L${X(d*.15)},${Y(N)} L${X(d*.12)},${Y(P.an)} L${X(d*.12)},${Y(P.k)} L${X(d*.03)},${Y(P.cr)} Z" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  });
  // торс
  s+=`<path d="M${X(-.12)},${Y(.92)} L${X(-.13)},${Y(P.sh-.12)} L${X(-.78)},${Y(P.sh)} L${X(-.6)},${Y(P.b)} L${X(-.4)},${Y(P.w)} L${X(-.68)},${Y(P.hp)} L${X(0)},${Y(P.cr)} L${X(.68)},${Y(P.hp)} L${X(.4)},${Y(P.w)} L${X(.6)},${Y(P.b)} L${X(.78)},${Y(P.sh)} L${X(.13)},${Y(P.sh-.12)} L${X(.12)},${Y(.92)} Z" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  // голова
  s+=`<ellipse cx="${X(0)}" cy="${Y(.5)}" rx="${(h*.36).toFixed(1)}" ry="${(h*.5).toFixed(1)}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
  return s;
}
function ruler(N,h,x,y0){
  let s="";
  for(let k=0;k<=Math.ceil(N);k++){
    const y=(y0+Math.min(k,N)*h).toFixed(1);
    s+=`<line x1="${x}" x2="${x+10}" y1="${y}" y2="${y}" stroke="${GOLD}" stroke-width="1"/>`;
    if(k<Math.ceil(N)) s+=`<text x="${x+2}" y="${(y0+(k+.5)*h+3).toFixed(1)}" font-size="8" fill="${GOLD}" font-family="Montserrat">${k+1}</text>`;
  }
  return s+`<line x1="${x+10}" x2="${x+10}" y1="${y0}" y2="${y0+N*h}" stroke="${GOLD}" stroke-width="1"/>`;
}
const figSVG = N => `<svg viewBox="0 0 130 300">${ruler(N,270/N,4,15)}${croquis(N,270/N,72,15)}</svg>`;

function balanceSVG(LT){
  const N=9,h=30,cx=130,y0=12,P=PROP[9];
  const pt=(x,y,l)=>`<circle cx="${x}" cy="${y}" r="5" fill="${GOLD}" stroke="#fff" stroke-width="1.5"/><line x1="${x-7}" x2="${x-40}" y1="${y}" y2="${y}" stroke="${GOLD}" stroke-width="1"/><text x="${x-46}" y="${y+5}" text-anchor="end" font-size="15" font-family="Playfair Display, serif" fill="${INK}">${l}</text>`;
  return `<svg viewBox="0 0 220 300">${croquis(N,h,cx,y0)}
   ${pt(cx,y0,LT[0])}${pt(cx,y0+(P.sh-.1)*h,LT[1])}${pt(cx,y0+3.3*h,LT[2])}${pt(cx,y0+N*h-4,LT[3])}</svg>`;
}

function satinSVG(id){
  const band=(x0,w)=>`<path d="M${x0},0 C${x0+30},60 ${x0-12},140 ${x0+18},200 L${x0+18+w},200 C${x0-12+w},140 ${x0+30+w},60 ${x0+w},0 Z" fill="url(#sat${id})"/>`;
  return `<svg viewBox="0 0 200 200"><defs><linearGradient id="sat${id}" x1="0" x2="1"><stop offset="0" stop-color="#3a0a14"/><stop offset=".38" stop-color="#8E1F24"/><stop offset=".5" stop-color="#f6dfe1"/><stop offset=".6" stop-color="#9b2a30"/><stop offset="1" stop-color="#2e0710"/></linearGradient></defs>
  <rect width="200" height="200" fill="#4a0f1c"/>${band(-30,75)}${band(40,70)}${band(105,80)}${band(170,70)}</svg>`;
}

  <path d="M0,40 C40,30 70,55 110,42 C150,30 180,50 200,40" fill="none" stroke="#c97d93" stroke-width="1.2" opacity=".8"/></svg>`;

function denimSVG(id){
  return `<svg viewBox="0 0 200 200"><defs><pattern id="tw${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="6" height="6" fill="#33528a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6f8cc0" stroke-width="2"/></pattern></defs>
  <rect width="200" height="200" fill="url(#tw${id})"/>
  <path d="M40,60 L160,60 L150,170 L100,190 L50,170Z" fill="none" stroke="#1f3561" stroke-width="2"/>
  <path d="M46,66 L154,66 L145,165 L100,183 L55,165Z" fill="none" stroke="#E0913A" stroke-width="1.6" stroke-dasharray="5 3"/>
  <path d="M50,72 L150,72" stroke="#E0913A" stroke-width="1.6" stroke-dasharray="5 3"/></svg>`;
}
function furSVG(id){
  let s=`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#a8896b"/>`, r=7;
  const rnd=()=>{ r=(r*9301+49297)%233280; return r/233280; };
  for(let n=0;n<520;n++){
    const x=rnd()*210-5, y=rnd()*210-5, a=(-60+rnd()*40)*Math.PI/180, L=10+rnd()*16;
    const c=["#6e5238","#c9ad8e","#8c6c4f","#e3cfb6"][Math.floor(rnd()*4)];
    s+=`<path d="M${x.toFixed(1)},${y.toFixed(1)} q${(Math.cos(a)*L*.5+3).toFixed(1)},${(Math.sin(a)*L*.5).toFixed(1)} ${(Math.cos(a)*L).toFixed(1)},${(Math.sin(a)*L).toFixed(1)}" stroke="${c}" stroke-width="${(1+rnd()*1.4).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  return s+`</svg>`;
}
function knitSVG(id){
  return `<svg viewBox="0 0 200 200"><defs><pattern id="kn${id}" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#d8c7b2"/><path d="M1,1 L8,10 L15,1" fill="none" stroke="#a88f74" stroke-width="2.4" stroke-linejoin="round"/></pattern></defs><rect width="200" height="200" fill="url(#kn${id})"/></svg>`;
}
function lightSVG(){
  return `<svg viewBox="0 0 200 190"><defs><linearGradient id="lg1" x1="0" x2="1"><stop offset="0" stop-color="#f7f2ea"/><stop offset=".25" stop-color="#e6ddd0"/><stop offset=".7" stop-color="#9a9187"/><stop offset="1" stop-color="#5e5850"/></linearGradient></defs>
  <rect width="200" height="190" fill="#fff"/>
  <ellipse cx="128" cy="168" rx="70" ry="9" fill="rgba(17,17,17,.22)"/>
  <path d="M80,30 L120,30 Q150,100 166,158 Q100,174 34,158 Q50,100 80,30Z" fill="url(#lg1)" stroke="#5e5850" stroke-width="1"/>
  <path d="M66,80 Q60,120 52,156" stroke="#fff" stroke-width="5" opacity=".7" fill="none" stroke-linecap="round"/>
  <path d="M100,40 Q104,100 108,166" stroke="#5e5850" stroke-width="1" opacity=".6" fill="none"/>
  <path d="M120,45 Q132,100 142,162" stroke="#3f3a34" stroke-width="1.2" opacity=".6" fill="none"/>
  <rect x="78" y="22" width="44" height="10" fill="#d9d0c3" stroke="#5e5850" stroke-width="1"/></svg>`;
}
function sheetSVG(kind,id){
  let fig="", extra="";
  if(kind==="tiny") fig=croquis(9,40/9,50,50,true);
  if(kind==="cut")  fig=croquis(9,160/9,50,4,true);
  if(kind==="good"){ fig=croquis(9,104/9,40,18,true); extra=`<rect x="68" y="34" width="20" height="26" fill="none" stroke="#bbb"/><rect x="68" y="72" width="20" height="30" fill="none" stroke="#bbb"/>`; }
  if(kind==="edge") fig=croquis(9,100/9,86,22,true);
  return `<svg viewBox="0 0 100 140"><defs><clipPath id="cp${id}"><rect x="5" y="5" width="90" height="130"/></clipPath></defs><rect x="5" y="5" width="90" height="130" fill="#fff"/><g clip-path="url(#cp${id})">${fig}${extra}</g><rect x="5" y="5" width="90" height="130" fill="none" stroke="#cfc6b8"/></svg>`;
}
function dressSVG(){
  return `<svg viewBox="0 0 160 200"><rect width="160" height="200" fill="#fff"/>
  <path d="M65,28 Q80,42 95,28 L122,34 Q120,52 108,60 Q98,74 95,92 Q125,140 142,182 Q80,194 18,182 Q35,140 65,92 Q62,74 52,60 Q40,52 38,34 Z" fill="${PAPER}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>

}

  D:[["Разберём экзаменационное задание","Imtihon topshirig'ini tahlil qilamiz"],["Покажем, как раскрыть тему и уложиться во время на реальном примере","Haqiqiy misolda mavzuni qanday ochish va vaqtga sig'ishni ko'rsatamiz"]]
};
const OFFER_FIRST = [["Разберём твои ошибки и работы","Xatolaringni va ishlaringni tahlil qilamiz"],["Возьми 2–3 рисунка: преподаватель академии разберёт их вживую вместе с ошибками из экзамена","2–3 ta rasmingni olib kel: akademiya o'qituvchisi ularni imtihondagi xatolar bilan birga jonli tahlil qiladi"]];
const OFFER_LAST = [["Составим твой план подготовки","Tayyorgarlik rejangni tuzamiz"],["Получишь персональный план до экзамена: что, в каком порядке и сколько времени прокачивать","Imtihongacha shaxsiy reja olasan: nimani, qaysi tartibda va qancha vaqt kuchaytirish kerak"]];
const LEVELS = [
  {min:10, s:["почти готова","deyarli tayyor"], t:["Ты хорошо понимаешь, что проверяют на экзамене","Imtihonda nima tekshirilishini yaxshi tushunasan"], d:["Теория у тебя сильная. Теперь важно, чтобы рука делала то же, что знает голова: отработать задания на время и отшлифовать подачу.","Nazariyang kuchli. Endi qo'ling ham boshing bilgan narsani qilishi muhim: topshiriqlarni vaqtga mashq qilish va taqdimotni sayqallash."]},
  {min:6, s:["уверенный старт","ishonchli start"], t:["База есть, но на экзамене ты потеряешь баллы","Asos bor, lekin imtihonda ball yo'qotasan"], d:["Ты многое понимаешь, но в нескольких темах есть пробелы. Именно на них абитуриенты чаще всего теряют баллы. Это исправляется системной подготовкой.","Ko'p narsani tushunasan, lekin bir nechta mavzuda bo'shliqlar bor. Aynan ularda abituriyentlar ko'pincha ball yo'qotadi. Bu tizimli tayyorgarlik bilan tuzatiladi."]},
  {min:0, s:["начало пути","yo'l boshi"], t:["Ты в начале пути, и это нормально","Sen yo'l boshidasan, va bu normal"], d:["Большинство наших учениц начинали с этого уровня. Чтобы поступить, нужно собрать базу: фигура, ткани, композиция. С правильной системой это реально.","O'quvchilarimizning ko'pchiligi aynan shu darajadan boshlagan. O'qishga kirish uchun asos kerak: qomat, matolar, kompozitsiya. To'g'ri tizim bilan bu haqiqatan ham mumkin."]}
];
const EXAM_LINES = [
  [["До экзамена меньше года","Imtihongacha bir yildan kam qoldi"],["Времени мало, но его хватит, если начать прямо сейчас и заниматься по плану. Самостоятельно закрыть эти пробелы за несколько месяцев сложно.","Vaqt kam, lekin hozirdan reja bo'yicha shug'ullansang, yetadi. Bu bo'shliqlarni bir necha oyda mustaqil yopish qiyin."]],
  [["До экзамена около года","Imtihongacha taxminan bir yil"],["Это оптимальный срок: успеешь закрыть пробелы и собрать сильное портфолио, если начнёшь в ближайший месяц.","Bu optimal muddat: yaqin bir oy ichida boshlasang, bo'shliqlarni yopib, kuchli portfolio yig'ishga ulgurasan."]],
  [["У тебя есть фора","Senda vaqt zaxirasi bor"],["Те, кто начинает за 1,5–2 года, приходят на экзамен самыми подготовленными. Главное — использовать это время системно.","1,5–2 yil oldin boshlaganlar imtihonga eng tayyor holda keladi. Asosiysi — bu vaqtdan tizimli foydalanish."]],
  [["Срок пока не выбран","Muddat hali tanlanmagan"],["Даже если ты ещё решаешь, базу стоит собрать заранее: фигура и ткани нужны для любого вуза по дизайну одежды.","Hali qaror qilayotgan bo'lsang ham, asosni oldindan yig'ish kerak: qomat va matolar kiyim dizayni bo'yicha istalgan oliygoh uchun kerak."]]
];

let i = 0, answers = [], result = null, locked = false;
document.querySelectorAll('[data-go="start"]').forEach(b => b.onclick = () => { i = 0; answers = []; render(); F.show("#s-quiz","quiz"); F.track("start_test"); });

function optLabel(q, k){ const o = q.opts[k]; return o.svg ? [ "вариант " + LETS[0][k], LETS[1][k] + " variant" ] : val(o.t); }

function render(){
  const it = Q[i];
  $("#counter").textContent = it.intro ? T("counter_intro", {n:i+1, t:NINTRO}) : T("counter", {n:i-NINTRO+1, t:TOTAL});
  $("#bar").style.width = (i/Q.length*100) + "%";
  $("#back").classList.toggle("show", i > 0);
  $("#qblock").innerHTML = it.intro ? tr(INTRO) : `<span class="num">${BLOCKS[it.block].roman}</span>${tr(BLOCKS[it.block].name)}`;
  $("#qtext").textContent = tr(it.q);
  $("#qhint").textContent = it.hint ? tr(it.hint) : "";
  $("#qimg").innerHTML = it.img ? `<div class="qimg">${it.img()}</div>` : "";
  $("#honest").style.display = it.intro ? "none" : "";
  const box = $("#opts"); box.innerHTML = "";
  box.className = "opts" + (it.grid ? " grid" : ""); box.style.setProperty("--cols", it.grid || 2);
  it.opts.forEach((o,k) => {
    const b = document.createElement("button"), sel = answers[i] === k ? " sel" : "";
    if (it.intro){ b.className = "opt"+sel; b.innerHTML = `<span class="mk"></span><span>${tr(o)}</span>`; }
    else if (o.svg){ b.className = "opt img"+sel; b.innerHTML = `${o.svg()}<span class="lb"><span class="mk"></span>${L()[k]}</span>`; }
    else { b.className = "opt"+sel; b.innerHTML = `<span class="mk"></span><span>${tr(val(o.t))}</span>`; }
    b.onclick = () => pick(k, b);
    box.appendChild(b);
  });
}
function pick(k, el){
  if (locked) return; locked = true; answers[i] = k;
  document.querySelectorAll(".opt").forEach(o => o.classList.remove("sel")); el.classList.add("sel");
  const it = Q[i];
  F.question(i+1, Q.length, it.intro ? F.ru(it.opts[k]) : (F.ru(optLabel(it,k)) + (it.opts[k].ok ? " ✓" : " ✗")));
  setTimeout(() => { locked = false; if (i < Q.length-1){ i++; render(); } else finish(); }, 340);
}
$("#back").onclick = () => { if (i > 0){ i--; render(); } };

function finish(){
  $("#bar").style.width = "100%";
  const per = {A:0,B:0,C:0,D:0}; let score = 0; const rows = [];
  Q.forEach((q,idx) => {
    if (q.intro) return;
    const ok = !!q.opts[answers[idx]].ok; if (ok){ score++; per[q.block]++; }
    rows.push({ q, ok, yk: answers[idx], ck: q.opts.findIndex(o => o.ok) });
  });
  const keys = Object.keys(BLOCKS), sorted = [...keys].sort((a,b) => per[a]-per[b]);
  let weakKeys = sorted.filter(k => per[k] <= 1).slice(0,2); if (!weakKeys.length) weakKeys = [sorted[0]];
  const lv = LEVELS.find(l => score >= l.min);
  result = { score, per, rows, weakKeys, lv };
  F.show("#s-load","load");
  document.querySelectorAll("#steps li").forEach((li,n) => setTimeout(() => li.classList.add("on"), 450+n*650));
  setTimeout(() => {
    renderResult(true); F.show("#s-result","result");
    F.track("result_view", score + "/" + TOTAL + " · " + F.ru(lv.s), { score: score + "/" + TOTAL });
    F.px("CompleteRegistration", { content_name:"ekzamen", value:score });
  }, 3300);
}

function renderResult(anim){
  const { score, per, rows, weakKeys, lv } = result;
  const el = $("#pct"); $("#ofmax").textContent = "/" + TOTAL;
  if (anim && score){ let n = 0; const s = setInterval(() => { n++; if (n >= score){ n = score; clearInterval(s); } el.textContent = n; }, 90); } else el.textContent = score;
  $("#level").textContent = tr(lv.s); $("#levelT").textContent = tr(lv.t); $("#levelD").textContent = tr(lv.d);
  const sc = $("#scale"); sc.innerHTML = ""; for (let k=0;k<TOTAL;k++){ const d = document.createElement("div"); if (k < score) d.className = "f"; sc.appendChild(d); }
  $("#skills").innerHTML = Object.keys(BLOCKS).map(k => {
    const v = per[k], status = v === 3 ? T("st_strong") : v === 2 ? T("st_gap") : T("st_weak");
    return `<div class="skill ${weakKeys.includes(k)?'weak':''}"><div class="row"><span class="nm"><span class="roman">${BLOCKS[k].roman}</span>${tr(BLOCKS[k].name)}</span><span class="v">${T("of3",{v})}</span></div><div class="tr"><i data-w="${v/3*100}" style="width:${anim?0:v/3*100}%"></i></div><div class="st">${status}</div></div>`;
  }).join("");
  if (anim) setTimeout(() => document.querySelectorAll(".skill .tr i").forEach(x => x.style.width = x.dataset.w + "%"), 250);
  $("#weak").innerHTML = weakKeys.map(k => `<div class="box g"><h4>${tr(BLOCKS[k].name)}</h4><p>${tr(ADVICE[k].weak)}</p><div class="fix">${tr(ADVICE[k].fix)}</div></div>`).join("");
  const exIdx = Q.findIndex(q => q.intro === "exam"), ex = EXAM_LINES[answers[exIdx] ?? 3];
  $("#timeline").innerHTML = `<div class="eyebrow">${tr(ex[0])}</div><p>${tr(ex[1])}</p><p class="s">${T("timeline_s")}</p>`;
  const lbl = (r,k) => { const o = r.q.opts[k]; return o.svg ? T("variant", {l:L()[k]}) : tr(val(o.t)); };
  const ordered = [...rows.filter(r => !r.ok), ...rows.filter(r => r.ok)];
  const opened = $("#toggleRv").style.display === "none" && !anim;
  $("#review").innerHTML = ordered.map((r,idx) => `<div class="rv ${r.ok?'ok':''}" ${idx>=4 && !opened ? 'data-more hidden' : ''}>
     <div class="h"><span>${tr(BLOCKS[r.q.block].name)}</span><b>${r.ok ? T("rv_ok") : T("rv_bad")}</b></div>
     <div class="q">${tr(r.q.q)}</div>
     <div class="a"><span>${T("your")}</span> ${lbl(r,r.yk)}${r.ok ? "" : `<br><span>${T("right")}</span> ${lbl(r,r.ck)}`}</div>
     <div class="e">${tr(r.q.ex)}</div></div>`).join("");
  if (anim) $("#toggleRv").style.display = ordered.length > 4 ? "" : "none";
  $("#toggleRv").onclick = () => { document.querySelectorAll("[data-more]").forEach(x => x.hidden = false); $("#toggleRv").style.display = "none"; F.track("review_open"); };
  const mistakes = rows.filter(r => !r.ok).length;
  $("#bridgeT").innerHTML = mistakes ? T("bridge", { m:mistakes, w: tr(BLOCKS[weakKeys[0]].name).toLowerCase() }) : T("bridge0");
  const items = [OFFER_FIRST, OFFER_ITEMS[weakKeys[0]], OFFER_LAST];
  $("#offerList").innerHTML = items.map((it,n) => `<li><span class="roman">${["I","II","III"][n]}</span><div><div class="t">${tr(it[0])}</div><div class="s">${tr(it[1])}</div></div></li>`).join("");
  if (anim) F.startTimer();
}

F.initForm({
  data: () => {
    const anketa = Q.filter(q => q.intro).map(q => F.ru(q.q) + " " + F.ru(q.opts[answers[Q.indexOf(q)]] || "")).join(" | ");
    const mist = result.rows.filter(r => !r.ok).map(r => F.ru(r.q.q)).join(" | ");
    return { score: result.score + "/" + TOTAL, level: F.ru(result.lv.s), weak: result.weakKeys.map(k => F.ru(BLOCKS[k].name)).join(", "), anketa, answers: "Ошибки: " + (mist || "нет") };
  },
  tg: (name, digits) => T("tg", { name, s: result.score, t: TOTAL, phone: digits })
});

F.init({ id:"ekzamen", name:"Экзамен", i18n:I18N, onLang: () => {
  const scr = document.querySelector(".screen.active").id;
  if (scr === "s-quiz") render();
  if (scr === "s-result" && result) renderResult(false);
}});
})();
</script>
</body>
</html>
